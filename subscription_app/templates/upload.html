<!DOCTYPE html>
<html>
<head>
  <title>Upload Excel</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }

    .upload-container {
      max-width: 500px;
      margin: auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .upload-container h2 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="file"] {
      padding: 10px;
      width: 100%;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-bottom: 20px;
    }

    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-weight: 500;
      color: green;
    }
  </style>
</head>
<body>

  <div class="upload-container">
    <h2>Upload Excel</h2>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      <label for="file">Select Excel File:</label>
      <input type="file" name="file" id="file" required>
      <button type="submit">Upload</button>
    </form>

    {% for message in messages %}
      <p class="message">{{ message }}</p>
    {% endfor %}
  </div>

</body>
</html>
